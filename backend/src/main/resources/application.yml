server:
  port: 1919

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stock_monitor?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      connection-error-retry-attempts: 3
      break-after-acquire-failure: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stock.monitor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 数据采集配置
collector:
  enabled: true
  interval-minutes: 30
  trading-hours-start: "09:30"
  trading-hours-end: "15:00"
  final-calibration-time: "15:10"
  rate-limit-per-minute: 10
  max-retry: 3
  retry-interval-ms: 5000

# 备份配置
backup:
  enabled: true
  path: ./backup
  retention-days: 30
  cron: "0 20 15 * * MON-FRI"

# 数据清理配置
cleanup:
  retention-years: 3
  cron: "0 0 2 * * SUN"

# API配置
api:
  eastmoney:
    base-url: https://push2.eastmoney.com
    market-index: /api/qt/stock/get
  sina:
    base-url: https://hq.sinajs.cn
  tonghuashun:
    base-url: https://d.10jqka.com.cn
